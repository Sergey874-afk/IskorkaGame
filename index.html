<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Волк ловит яйца</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;
       justify-content:center;height:100vh;font-family:sans-serif;color:#fff;
       overflow:hidden;touch-action:none;user-select:none}
  #hud{display:flex;justify-content:space-between;width:100%;max-width:360px;
       padding:8px 16px;font-size:16px}
  #game{background:linear-gradient(#87CEEB,#E0F6FF);border-radius:10px;
        display:block;touch-action:none;max-width:100%;height:auto}
  #overlay{position:absolute;inset:0;background:rgba(0,0,0,.8);display:none;
           flex-direction:column;align-items:center;justify-content:center;
           gap:16px;z-index:10;padding:20px;text-align:center}
  #overlay.show{display:flex}
  button{padding:12px 28px;font-size:17px;border:none;border-radius:10px;
         background:#fc0;color:#1a1a2e;font-weight:bold;cursor:pointer}
  button:active{transform:scale(.95)}
</style>
</head>
<body>

<div id="hud">
  <span>🥚 Яйца: <b id="score">0</b></span>
  <span>❤️ Жизни: <b id="lives">3</b></span>
</div>

<canvas id="game" width="360" height="500"></canvas>

<div id="overlay">
  <h2 id="overlayText">Игра окончена</h2>
  <p id="finalScore"></p>
  <button id="restartBtn">Играть снова</button>
</div>

<script>
if (window.Telegram && Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const finalScore = document.getElementById('finalScore');
const restartBtn = document.getElementById('restartBtn');

const W = canvas.width, H = canvas.height;
let wolf, eggs, score, lives, running, spawnTimer, fallSpeed;
const keys = { left:false, right:false };

function reset() {
  wolf = { x: W/2 - 40, y: H - 80, w: 80, h: 70, speed: 6 };
  eggs = []; score = 0; lives = 3; running = true;
  spawnTimer = 0; fallSpeed = 2;
  scoreEl.textContent = 0;
  livesEl.textContent = 3;
  overlay.classList.remove('show');
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

function moveWolfTo(clientX) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const px = (clientX - rect.left) * scaleX;
  wolf.x = Math.max(0, Math.min(W - wolf.w, px - wolf.w/2));
}
canvas.addEventListener('touchstart', e => { e.preventDefault(); moveWolfTo(e.touches[0].clientX); }, {passive:false});
canvas.addEventListener('touchmove',  e => { e.preventDefault(); moveWolfTo(e.touches[0].clientX); }, {passive:false});
canvas.addEventListener('mousedown', e => moveWolfTo(e.clientX));
canvas.addEventListener('mousemove', e => { if (e.buttons === 1) moveWolfTo(e.clientX); });

function drawWolf() {
  const { x, y, w, h } = wolf;
  ctx.fillStyle = '#6b6b6b';
  ctx.beginPath(); ctx.roundRect(x, y + 15, w, h - 15, 8); ctx.fill();
  ctx.fillStyle = '#8a8a8a';
  ctx.beginPath(); ctx.arc(x + w/2, y + 20, 22, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#6b6b6b';
  ctx.beginPath(); ctx.moveTo(x+w/2-18,y+10); ctx.lineTo(x+w/2-10,y-10); ctx.lineTo(x+w/2-2,y+10); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x+w/2+2,y+10);  ctx.lineTo(x+w/2+10,y-10); ctx.lineTo(x+w/2+18,y+10); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x+w/2-8,y+18,5,0,Math.PI*2); ctx.arc(x+w/2+8,y+18,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(x+w/2-8,y+19,2.5,0,Math.PI*2); ctx.arc(x+w/2+8,y+19,2.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(x+w/2,y+30,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(x+5, y+h-15, w-10, 12);
  ctx.strokeStyle = '#5a2d0c'; ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(x+5+(w-10)*i/4, y+h-15);
    ctx.lineTo(x+5+(w-10)*i/4, y+h-3);
    ctx.stroke();
  }
}

function drawEgg(e) {
  ctx.fillStyle = '#FFF8DC'; ctx.strokeStyle = '#D2B48C'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(e.x, e.y, e.r*0.75, e.r, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.ellipse(e.x-3, e.y-5, 3, 5, -0.3, 0, Math.PI*2); ctx.fill();
}

function drawBg() {
  ctx.fillStyle = '#7CB342'; ctx.fillRect(0, H-25, W, 25);
  ctx.fillStyle = '#558B2F';
  for (let i = 0; i < W; i += 60) {
    ctx.beginPath(); ctx.arc(i+30, H-25, 15, Math.PI, 0); ctx.fill();
  }
}

let lastTime = 0;
function loop(t) {
  const dt = Math.min(t - lastTime, 50); lastTime = t;
  if (running) {
    if (keys.left)  wolf.x = Math.max(0, wolf.x - wolf.speed * (dt/16));
    if (keys.right) wolf.x = Math.min(W - wolf.w, wolf.x + wolf.speed * (dt/16));

    spawnTimer += dt;
    const iv = Math.max(400, 1000 - score*30);
    if (spawnTimer > iv) {
      spawnTimer = 0;
      eggs.push({ x: 20 + Math.random()*(W-40), y: -20,
                  r: 12 + Math.random()*6, speed: fallSpeed + Math.random()*1.5 });
    }
    for (let i = eggs.length-1; i >= 0; i--) {
      const egg = eggs[i];
      egg.y += egg.speed * (dt/16);
      if (egg.y+egg.r >= wolf.y+wolf.h-15 && egg.y-egg.r <= wolf.y+wolf.h &&
          egg.x >= wolf.x && egg.x <= wolf.x+wolf.w) {
        eggs.splice(i,1); score++; scoreEl.textContent = score;
        fallSpeed = 2 + score*0.08; continue;
      }
      if (egg.y - egg.r > H-25) {
        eggs.splice(i,1); lives--; livesEl.textContent = lives;
        if (lives <= 0) {
          running = false;
          overlayText.textContent = '🐺 Волк остался голодным!';
          finalScore.textContent = 'Собрано яиц: ' + score;
          overlay.classList.add('show');
        }
      }
    }
  }
  ctx.clearRect(0,0,W,H);
  drawBg();
  eggs.forEach(drawEgg);
  drawWolf();
  requestAnimationFrame(loop);
}

restartBtn.addEventListener('click', reset);
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
