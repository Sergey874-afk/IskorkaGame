<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Искорка ловит сообщения</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;
       justify-content:center;height:100vh;font-family:sans-serif;color:#fff;
       overflow:hidden;touch-action:none;user-select:none}
  #hud{display:flex;justify-content:space-between;width:100%;max-width:360px;
       padding:8px 16px;font-size:16px}
  #game{background:linear-gradient(#2b2b4a, #14142b);border-radius:10px;
        display:block;touch-action:none;max-width:100%;height:auto}
  #overlay{position:absolute;inset:0;background:rgba(0,0,0,.8);display:none;
           flex-direction:column;align-items:center;justify-content:center;
           gap:16px;z-index:10;padding:20px;text-align:center}
  #overlay.show{display:flex}
  button{padding:12px 28px;font-size:17px;border:none;border-radius:10px;
         background:#ffaa00;color:#1a1a2e;font-weight:bold;cursor:pointer}
  button:active{transform:scale(.95)}
</style>
</head>
<body>

<div id="hud">
  <span>💬 Собрано: <b id="score">0</b></span>
  <span>❤️ Жизни: <b id="lives">3</b></span>
</div>

<canvas id="game" width="360" height="500"></canvas>

<div id="overlay">
  <h2 id="overlayText">Игра окончена</h2>
  <p id="finalScore"></p>
  <button id="restartBtn">Играть снова</button>
</div>

<script>
if (window.Telegram && Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const finalScore = document.getElementById('finalScore');
const restartBtn = document.getElementById('restartBtn');

const W = canvas.width, H = canvas.height;
let wolf, eggs, score, lives, running, spawnTimer, fallSpeed;
const keys = { left:false, right:false };

// Загрузка картинки Искорки
const iskorkaImg = new Image();
iskorkaImg.src = 'iskorka.png';

function reset() {
  // Размеры Искорки (подгоняем под картинку)
  wolf = { x: W/2 - 45, y: H - 110, w: 90, h: 90, speed: 6 };
  eggs = []; score = 0; lives = 3; running = true;
  spawnTimer = 0; fallSpeed = 2;
  scoreEl.textContent = 0;
  livesEl.textContent = 3;
  overlay.classList.remove('show');
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

function moveWolfTo(clientX) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const px = (clientX - rect.left) * scaleX;
  wolf.x = Math.max(0, Math.min(W - wolf.w, px - wolf.w/2));
}
canvas.addEventListener('touchstart', e => { e.preventDefault(); moveWolfTo(e.touches[0].clientX); }, {passive:false});
canvas.addEventListener('touchmove',  e => { e.preventDefault(); moveWolfTo(e.touches[0].clientX); }, {passive:false});
canvas.addEventListener('mousedown', e => moveWolfTo(e.clientX));
canvas.addEventListener('mousemove', e => { if (e.buttons === 1) moveWolfTo(e.clientX); });

// Рисуем Искорку
function drawWolf() {
  if (iskorkaImg.complete) {
    ctx.drawImage(iskorkaImg, wolf.x, wolf.y, wolf.w, wolf.h);
  } else {
    // Пока картинка грузится, рисуем кружок
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath();
    ctx.arc(wolf.x + wolf.w/2, wolf.y + wolf.h/2, wolf.w/2, 0, Math.PI*2);
    ctx.fill();
  }
}

// Рисуем пузырь сообщения
function drawBubble(x, y, r) {
  // Белый пузырь
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 2;
  ctx.beginPath();
  
  // Форма пузыря (круг с хвостиком)
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();
  
  // Хвостик
  ctx.beginPath();
  ctx.moveTo(x - r*0.5, y + r*0.8);
  ctx.lineTo(x - r*0.8, y + r*1.2);
  ctx.lineTo(x - r*0.1, y + r*0.9);
  ctx.fill();
  ctx.stroke();

  // Три чёрные точки внутри
  ctx.fillStyle = '#333';
  const dotR = r * 0.15;
  const spacing = r * 0.4;
  ctx.beginPath();
  ctx.arc(x - spacing, y, dotR, 0, Math.PI*2);
  ctx.arc(x, y, dotR, 0, Math.PI*2);
  ctx.arc(x + spacing, y, dotR, 0, Math.PI*2);
  ctx.fill();
}

function drawEgg(e) {
  drawBubble(e.x, e.y, e.r);
}

function drawBg() {
  // Тёмный фон для контраста
  ctx.fillStyle = '#14142b';
  ctx.fillRect(0, H-25, W, 25);
  ctx.fillStyle = '#2b2b4a';
  for (let i = 0; i < W; i += 60) {
    ctx.beginPath(); ctx.arc(i+30, H-25, 15, Math.PI, 0); ctx.fill();
  }
}

let lastTime = 0;
function loop(t) {
  const dt = Math.min(t - lastTime, 50); lastTime = t;
  if (running) {
    if (keys.left)  wolf.x = Math.max(0, wolf.x - wolf.speed * (dt/16));
    if (keys.right) wolf.x = Math.min(W - wolf.w, wolf.x + wolf.speed * (dt/16));

    spawnTimer += dt;
    const iv = Math.max(400, 1000 - score*30);
    if (spawnTimer > iv) {
      spawnTimer = 0;
      eggs.push({ x: 20 + Math.random()*(W-40), y: -20,
                  r: 18 + Math.random()*8, speed: fallSpeed + Math.random()*1.5 });
    }
    for (let i = eggs.length-1; i >= 0; i--) {
      const egg = eggs[i];
      egg.y += egg.speed * (dt/16);
      
      // Проверка столкновения (ловит Искорка)
      if (egg.y+egg.r >= wolf.y+wolf.h-20 && egg.y-egg.r <= wolf.y+wolf.h &&
          egg.x >= wolf.x && egg.x <= wolf.x+wolf.w) {
        eggs.splice(i,1); score++; scoreEl.textContent = score;
        fallSpeed = 2 + score*0.08; continue;
      }
      
      // Если упало вниз
      if (egg.y - egg.r > H-25) {
        eggs.splice(i,1); lives--; livesEl.textContent = lives;
        if (lives <= 0) {
          running = false;
          overlayText.textContent = 'Искорка загрустила... 😢';
          finalScore.textContent = 'Собрано сообщений: ' + score;
          overlay.classList.add('show');
        }
      }
    }
  }
  ctx.clearRect(0,0,W,H);
  drawBg();
  eggs.forEach(drawEgg);
  drawWolf();
  requestAnimationFrame(loop);
}

restartBtn.addEventListener('click', reset);
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
